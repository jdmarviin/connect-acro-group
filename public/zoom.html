<!DOCTYPE html>
<html>
<head>
    <title>Zoom Meeting</title>
    <meta charset="utf-8" />
    <link type="text/css" rel="stylesheet" href="/zoom-meetingsdk.css" />
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        body { padding: 0; margin: 0; background: black; }
        #zmmtg-root { width: 100%; height: 100%; position: absolute; }
    </style>
</head>
<body>
    <div id="zmmtg-root"></div>
    <div id="aria-notify-area"></div>

    <script src="https://source.zoom.us/6.2.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/6.2.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/6.2.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/6.2.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/6.2.0/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/zoom-meeting-6.2.0.min.js"></script>
    
    <script>
        async function startMeeting() {
            const meetingNumber = new URLSearchParams(window.location.search).get('meetingNumber');
            const response = await fetch('/api/zoom/signature', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ meetingNumber })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Não foi possível entrar.');
            if (typeof ZoomMtg === 'undefined') throw new Error('Não foi possível carregar o Zoom. Atualize a página.');
            ZoomMtg.setZoomJSLib('https://source.zoom.us/6.2.0/lib', '/av');
            ZoomMtg.preLoadWasm();
            ZoomMtg.prepareWebSDK();
            const showError = () => showMessage('Não foi possível conectar ao Zoom. Atualize a página ou volte ao painel.');
            ZoomMtg.init({
                leaveUrl: window.location.origin + '/dashboard',
                success: function () {
                    ZoomMtg.join({
                        signature: data.signature, meetingNumber,
                        passWord: data.password, userName: data.userName,
                        userEmail: data.userEmail, customerKey: data.customerKey,
                        success: function () {}, error: showError
                    });
                },
                error: showError
            });
        }
        function showMessage(message) {
            const box = document.createElement('div');
            box.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#111;color:white;padding:48px;font:18px sans-serif';
            box.textContent = message;
            const link = document.createElement('a');
            link.href = '/dashboard'; link.target = '_top'; link.textContent = ' Voltar ao painel'; link.style.color = '#93c5fd';
            box.appendChild(link); document.body.appendChild(box);
        }
        startMeeting().catch(error => showMessage(error.message));
    </script>
</body>
</html>
